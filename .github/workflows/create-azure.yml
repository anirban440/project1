name: Azure Setup
on: [push] # This means "Run whenever I push code"

jobs:
  setup-azure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }} # This uses the secret you saved
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create RG
        run: az group create --name "MyNewRG" --location "eastus2"